apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-solar-control-loop
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  solar-control-loop.json: |
    {
      "title": "Solar Control Loop Demo",
      "uid": "solar-control-loop-demo",
      "schemaVersion": 39,
      "version": 2,
      "editable": true,
      "timezone": "browser",
      "refresh": "5s",
      "tags": ["kcd", "solar", "keda", "demo"],
      "time": {
        "from": "now-15m",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Measured Solar Power (W)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "min": 0
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max(solar_generation_watts{cluster=\"factory-pi\"})",
              "legendFormat": "solar_generation_watts"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "LED Controller Deployment Replicas",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "kube_deployment_status_replicas{namespace=\"default\",deployment=\"smart-led-controller\"}",
              "legendFormat": "smart-led-controller"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "KEDA HPA Current Replicas",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "kube_horizontalpodautoscaler_status_current_replicas{namespace=\"default\",horizontalpodautoscaler=\"keda-hpa-led-autoscaler\"}",
              "legendFormat": "keda-hpa-led-autoscaler"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "LED Controller Pods Running",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_pod_status_phase{namespace=\"default\",pod=~\"smart-led-controller-.*\",phase=\"Running\"})",
              "legendFormat": "running pods"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Fan Controller Deployment Replicas",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "kube_deployment_status_replicas{namespace=\"default\",deployment=\"smart-vetrak-controller\"}",
              "legendFormat": "smart-vetrak-controller"
            }
          ]
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Solar Threshold (W)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 0.5 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max(solar_generation_watts{cluster=\"factory-pi\"})",
              "legendFormat": "current"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "fields": "",
              "values": false
            },
            "orientation": "horizontal",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto"
          }
        },
        {
          "id": 7,
          "type": "stat",
          "title": "Solar Mode",
          "gridPos": { "h": 5, "w": 6, "x": 0, "y": 24 },
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": { "text": "LOW (cloud/blackout)", "color": "orange" },
                    "1": { "text": "HIGH (sun/recover)", "color": "green" }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "orange", "value": null },
                  { "color": "green", "value": 1 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max(solar_generation_watts{cluster=\"factory-pi\"}) > bool 0.5",
              "legendFormat": "solar-mode"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "fields": "",
              "values": false
            },
            "orientation": "horizontal",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center"
          }
        },
        {
          "id": 8,
          "type": "stat",
          "title": "LED Pod",
          "gridPos": { "h": 5, "w": 6, "x": 6, "y": 24 },
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": { "text": "OFF", "color": "red" },
                    "1": { "text": "ON", "color": "green" }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max(kube_deployment_status_replicas{namespace=\"default\",deployment=\"smart-led-controller\"})",
              "legendFormat": "led"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "fields": "",
              "values": false
            },
            "orientation": "horizontal",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center"
          }
        },
        {
          "id": 9,
          "type": "stat",
          "title": "Fan Pod",
          "gridPos": { "h": 5, "w": 6, "x": 12, "y": 24 },
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": { "text": "OFF", "color": "red" },
                    "1": { "text": "ON", "color": "green" }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max(kube_deployment_status_replicas{namespace=\"default\",deployment=\"smart-vetrak-controller\"})",
              "legendFormat": "fan"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "fields": "",
              "values": false
            },
            "orientation": "horizontal",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center"
          }
        },
        {
          "id": 10,
          "type": "stat",
          "title": "KEDA LED Active",
          "gridPos": { "h": 5, "w": 6, "x": 18, "y": 24 },
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": { "text": "INACTIVE", "color": "orange" },
                    "1": { "text": "ACTIVE", "color": "green" }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "orange", "value": null },
                  { "color": "green", "value": 1 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max(solar_generation_watts{cluster=\"factory-pi\"}) > bool 0.5",
              "legendFormat": "keda-led-active"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "fields": "",
              "values": false
            },
            "orientation": "horizontal",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center"
          }
        }
      ]
    }
