# Scrape jobs that pull metrics from the factory cluster through the factory
# kube-apiserver's /proxy/ endpoint, authenticating with the hq-controller
# bearer token mounted at /etc/prometheus/secrets/factory-credentials/.
#
# The Prometheus operator mounts secrets named in `prometheus.spec.secrets`
# at /etc/prometheus/secrets/<name>/, so token + ca.crt are available on disk.

# 1. factory API-server-level metrics (cAdvisor + kubelet via apiserver proxy).
- job_name: 'factory/kubelet'
  scheme: https
  tls_config:
    ca_file: /etc/prometheus/secrets/factory-credentials/ca.crt
    insecure_skip_verify: false
  bearer_token_file: /etc/prometheus/secrets/factory-credentials/token
  kubernetes_sd_configs:
    - role: node
      api_server: https://host.k3d.internal:6443
      tls_config:
        ca_file: /etc/prometheus/secrets/factory-credentials/ca.crt
      bearer_token_file: /etc/prometheus/secrets/factory-credentials/token
  relabel_configs:
    - target_label: cluster
      replacement: factory
    - action: labelmap
      regex: __meta_kubernetes_node_label_(.+)
    - target_label: __address__
      replacement: host.k3d.internal:6443
    - source_labels: [__meta_kubernetes_node_name]
      regex: (.+)
      target_label: __metrics_path__
      replacement: /api/v1/nodes/${1}/proxy/metrics

- job_name: 'factory/cadvisor'
  scheme: https
  tls_config:
    ca_file: /etc/prometheus/secrets/factory-credentials/ca.crt
  bearer_token_file: /etc/prometheus/secrets/factory-credentials/token
  kubernetes_sd_configs:
    - role: node
      api_server: https://host.k3d.internal:6443
      tls_config:
        ca_file: /etc/prometheus/secrets/factory-credentials/ca.crt
      bearer_token_file: /etc/prometheus/secrets/factory-credentials/token
  relabel_configs:
    - target_label: cluster
      replacement: factory
    - action: labelmap
      regex: __meta_kubernetes_node_label_(.+)
    - target_label: __address__
      replacement: host.k3d.internal:6443
    - source_labels: [__meta_kubernetes_node_name]
      regex: (.+)
      target_label: __metrics_path__
      replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor

# 2. node-exporter on factory (DaemonSet, hostPort 9100, reached via pod proxy).
- job_name: 'factory/node-exporter'
  scheme: https
  tls_config:
    ca_file: /etc/prometheus/secrets/factory-credentials/ca.crt
  bearer_token_file: /etc/prometheus/secrets/factory-credentials/token
  kubernetes_sd_configs:
    - role: pod
      api_server: https://host.k3d.internal:6443
      namespaces:
        names: [monitoring]
      tls_config:
        ca_file: /etc/prometheus/secrets/factory-credentials/ca.crt
      bearer_token_file: /etc/prometheus/secrets/factory-credentials/token
  relabel_configs:
    - target_label: cluster
      replacement: factory
    - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
      regex: prometheus-node-exporter
      action: keep
    - source_labels: [__meta_kubernetes_pod_container_port_name]
      regex: metrics
      action: keep
    - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_pod_name]
      regex: (.+);(.+)
      target_label: __metrics_path__
      replacement: /api/v1/namespaces/${1}/pods/${2}:9100/proxy/metrics
    - target_label: __address__
      replacement: host.k3d.internal:6443
    - source_labels: [__meta_kubernetes_pod_node_name]
      target_label: instance

