apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: factory-kepler
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    name: factory                                  # workloads live here
    namespace: kepler
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  source:
    repoURL: https://sustainable-computing-io.github.io/kepler-helm-chart
    chart: kepler
    targetRevision: 0.5.10
    helm:
      releaseName: kepler
      values: |
        # Kepler reads kernel/eBPF stats; needs privileged DaemonSet on each node.
        # On k3d (containers as nodes) this works out of the box.
        serviceMonitor:
          enabled: true   # CRD provided by factory-prometheus-crds app
        # HQ Prometheus scrapes Kepler via additionalScrapeConfigs (proxy), not via operator discovery.
        resources:
          requests: { cpu: 50m, memory: 100Mi }
          limits:   { memory: 400Mi }
        # Dashboard lives on HQ Grafana, not on factory.
        dashboard:
          enabled: false
